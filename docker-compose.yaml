networks:
  listtick-network:
    external: true

services:
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command: start-dev
    ports:
      - "8090:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://listtick-db:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: admin
      KC_SPI_EVENTS_LISTENER: "jboss-logging,webhook"
      KC_SPI_EVENTS_LISTENER_WEBHOOK_SERVER_URL: "http://host.docker.internal:8080/api/keycloak-events"
      KC_SPI_EVENTS_LISTENER_WEBHOOK_MAX_RETRIES: "3"
      KC_SPI_EVENTS_LISTENER_WEBHOOK_CONNECT_TIMEOUT: "5000"
      KC_SPI_EVENTS_LISTENER_WEBHOOK_READ_TIMEOUT: "5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - listtick-network
